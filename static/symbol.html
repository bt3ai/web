function parseCSV(csv) {
  const lines = csv.trim().split("\n");
  const headers = lines[0].split(",");
  const rows = lines.slice(1).map(line =>
    Object.fromEntries(
      line.split(",").map((v, i) => [headers[i], v])
    )
  );
  return { headers, rows };
}

/* ================= RENDER JSON ================= */
function renderJSONMessages() {
  const container = document.getElementById("jsonMessages");
  container.innerHTML = "";

  const groups = {};
  jsonMessages.forEach(m => {
    const key = m.symbol.trim().split(/\s+/)[0];
    groups[key] ??= [];
    groups[key].push(m);
  });

  Object.entries(groups).forEach(([symbol, items]) => {
    const group = document.createElement("div");
    group.className = "json-group";

    const header = document.createElement("div");
    header.className = "json-header";
    header.innerHTML = `<span>▶</span>${symbol}`;

    const itemsDiv = document.createElement("div");
    itemsDiv.className = "json-items";

    header.onclick = () => {
      const open = itemsDiv.style.display === "block";
      itemsDiv.style.display = open ? "none" : "block";
      header.querySelector("span").textContent = open ? "▶" : "▼";
    };

    items.forEach(obj => {
      const item = document.createElement("div");
      item.className = "json-item";

      const pre = document.createElement("pre");
      pre.className = "json-block";
      pre.textContent = JSON.stringify(obj, null, 2);

      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "Copy";
      btn.onclick = () => {
        navigator.clipboard.writeText(pre.textContent);
        btn.textContent = "Copied";
        setTimeout(() => btn.textContent = "Copy", 1000);
      };

      item.appendChild(btn);
      item.appendChild(pre);
      itemsDiv.appendChild(item);
    });

    group.appendChild(header);
    group.appendChild(itemsDiv);
    container.appendChild(group);
  });
}
