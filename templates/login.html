<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Autotrader Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; background: #f9fafb; display:flex; justify-content:center; align-items:center; height:100vh; }
  .login-box { background:white; padding:2rem; border-radius:5px; box-shadow:0 5px 15px rgba(0,0,0,0.2); width:300px; }
  input { width:100%; padding:0.5rem; margin-bottom:1rem; }
  button { width:100%; padding:0.5rem; cursor:pointer; }
  .error { color:red; margin-bottom:1rem; text-align:center; }
</style>
</head>
<body>

<div class="login-box">
  <h2 style="text-align:center;">Login</h2>
  {% with messages = get_flashed_messages(category_filter=["error"]) %}
    {% if messages %}
      <div class="error">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}
  <form method="POST" action="{{ url_for('login') }}">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
</div>

</body>
</html></title>
</head>
<body>

</body>
</html>
