<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dataset Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 1rem;
      background: #f9fafb;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    input {
      padding: 0.5rem;
      margin-bottom: 1rem;
      width: 100%;
      max-width: 300px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 0.6rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      cursor: pointer;
      background: #f3f4f6;
    }

    th:hover {
      background: #e5e7eb;
    }

    .pagination {
      margin-top: 1rem;
    }

    .pagination button {
      padding: 0.4rem 0.7rem;
      margin-right: 0.25rem;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      table {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

<h1>Dataset Viewer</h1>

<input type="text" id="search" placeholder="Search..." />

<table id="table">
  <thead>
    <tr id="header-row"></tr>
  </thead>
  <tbody></tbody>
</table>

<div class="pagination" id="pagination"></div>

<script>
/* ================= CSV DATA ================= */
/* Replace this CSV with your own */
const csvData = `
id,name,category,value
1,Alpha,A,42
2,Beta,B,36
3,Gamma,A,58
4,Delta,C,21
5,Epsilon,B,90
6,Zeta,A,12
7,Eta,C,33
8,Theta,B,77
9,Iota,A,64
10,Kappa,C,25
`;

/* ================= PARSE CSV ================= */
function parseCSV(csv) {
  const lines = csv.trim().split("\n");
  const headers = lines[0].split(",");
  const rows = lines.slice(1).map(line =>
    Object.fromEntries(
      line.split(",").map((value, i) => [headers[i], value])
    )
  );
  return { headers, rows };
}

const { headers, rows } = parseCSV(csvData);

/* ================= STATE ================= */
let currentPage = 1;
let rowsPerPage = 5;
let sortColumn = null;
let sortAsc = true;
let filteredRows = [...rows];

/* ================= RENDER ================= */
function renderTable() {
  const tbody = document.querySelector("tbody");
  tbody.innerHTML = "";

  const start = (currentPage - 1) * rowsPerPage;
  const pageRows = filteredRows.slice(start, start + rowsPerPage);

  pageRows.forEach(row => {
    const tr = document.createElement("tr");
    headers.forEach(h => {
      const td = document.createElement("td");
      td.textContent = row[h];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  renderPagination();
}

function renderHeaders() {
  const headerRow = document.getElementById("header-row");
  headerRow.innerHTML = "";

  headers.forEach(h => {
    const th = document.createElement("th");
    th.textContent = h;
    th.onclick = () => sortBy(h);
    headerRow.appendChild(th);
  });
}

function renderPagination() {
  const pageCount = Math.ceil(filteredRows.length / rowsPerPage);
  const pagination = document.getElementById("pagination");
  pagination.innerHTML = "";

  for (let i = 1; i <= pageCount; i++) {
    const btn = document.createElement("button");
    btn.textContent = i;
    btn.disabled = i === currentPage;
    btn.onclick = () => {
      currentPage = i;
      renderTable();
    };
    pagination.appendChild(btn);
  }
}

/* ================= SORT ================= */
function sortBy(column) {
  sortAsc = sortColumn === column ? !sortAsc : true;
  sortColumn = column;

  filteredRows.sort((a, b) => {
    const valA = a[column];
    const valB = b[column];

    if (!isNaN(valA) && !isNaN(valB)) {
      return sortAsc ? valA - valB : valB - valA;
    }
    return sortAsc
      ? valA.localeCompare(valB)
      : valB.localeCompare(valA);
  });

  renderTable();
}

/* ================= SEARCH ================= */
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  filteredRows = rows.filter(row =>
    Object.values(row).some(v => v.toLowerCase().includes(q))
  );
  currentPage = 1;
  renderTable();
});

/* ================= INIT ================= */
renderHeaders();
renderTable();
</script>

</body>
</html>
